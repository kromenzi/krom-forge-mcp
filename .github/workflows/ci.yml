name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - v52
      - v53-2000-tools
      - v54-5000-tools
      - v55-adaptive-runtime
      - v56-self-healing-runtime
      - v57-autonomous-brain
      - v58-engineering-os
      - v59-control-fabric
      - v60-runtime-mesh
      - v61-intelligence-grid
      - v62-decision-core
      - v63-trust-governance
      - v64-adaptive-trust-runtime
      - v65-identity-delegation-plane
      - v66-autonomous-verification-plane
      - v67-reliability-recovery-plane
      - v68-incident-command-recovery-orchestration
      - v69-autonomous-operations-governance-superplane
      - v70-autonomous-delivery-verification-mesh
      - v71-continuous-assurance-learning-plane
      - feat/v76-semantic-skill-runtime
      - feat/v77-native-skill-runtime

jobs:
  contract:
    name: Node ${{ matrix.node }} contract gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify AST manifest and registry contracts
        run: npm run verify:mcp

      - name: Verify automation integrity
        run: npm run verify:automation

      - name: Verify v55 adaptive runtime
        run: npm run verify:v55

      - name: Verify v56 self-healing runtime
        run: npm run verify:v56

      - name: Verify v57 autonomous brain
        run: npm run verify:v57

      - name: Verify v58 engineering OS
        run: npm run verify:v58

      - name: Verify v59 control fabric
        run: npm run verify:v59

      - name: Verify v60 runtime mesh
        run: npm run verify:v60

      - name: Verify v61 intelligence grid
        run: npm run verify:v61

      - name: Verify v62 decision core
        run: npm run verify:v62

      - name: Verify v63 trust governance
        run: npm run verify:v63

      - name: Verify v64 adaptive trust runtime
        run: npm run verify:v64

      - name: Verify v65 identity delegation plane
        run: npm run verify:v65

      - name: Verify v66 autonomous verification
        run: npm run verify:v66

      - name: Verify v67 reliability recovery
        run: npm run verify:v67

      - name: Verify v68 incident command
        run: npm run verify:v68

      - name: Verify v69 operations governance
        run: npm run verify:v69

      - name: Verify v70 delivery verification
        run: npm run verify:v70

      - name: Verify v71 continuous assurance
        run: npm run verify:v71

      - name: Verify v72 skill assurance
        run: npm run verify:v72

      - name: Verify v73 patch bundle
        run: npm run verify:v73

      - name: Verify v74 skill registry
        run: npm run verify:v74

      - name: Verify v75 agent capability fabric
        run: npm run verify:v75

      - name: Verify v76 semantic skill runtime
        run: npm run verify:v76

      - name: Verify v77 native skill runtime
        run: npm run verify:v77

      - name: Unit tests
        run: npm test

  quality:
    name: Production quality gate
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify MCP registration, capabilities and version consistency
        run: npm run verify:mcp -- --output .artifacts/mcp-verification.json --manifest-output .artifacts/mcp-manifest.json

      - name: Verify automation integrity
        run: npm run verify:automation

      - name: Verify v55 adaptive runtime
        run: npm run verify:v55

      - name: Verify v56 self-healing runtime
        run: npm run verify:v56

      - name: Verify v57 autonomous brain
        run: npm run verify:v57

      - name: Verify v58 engineering OS
        run: npm run verify:v58

      - name: Verify v59 control fabric
        run: npm run verify:v59

      - name: Verify v60 runtime mesh
        run: npm run verify:v60

      - name: Verify v61 intelligence grid
        run: npm run verify:v61

      - name: Verify v62 decision core
        run: npm run verify:v62

      - name: Verify v63 trust governance
        run: npm run verify:v63

      - name: Verify v64 adaptive trust runtime
        run: npm run verify:v64

      - name: Verify v65 identity delegation plane
        run: npm run verify:v65

      - name: Verify v66 autonomous verification
        run: npm run verify:v66

      - name: Verify v67 reliability recovery
        run: npm run verify:v67

      - name: Verify v68 incident command
        run: npm run verify:v68

      - name: Verify v69 operations governance
        run: npm run verify:v69

      - name: Verify v70 delivery verification
        run: npm run verify:v70

      - name: Verify v71 continuous assurance
        run: npm run verify:v71

      - name: Verify v72 skill assurance
        run: npm run verify:v72

      - name: Verify v73 patch bundle
        run: npm run verify:v73

      - name: Verify v74 skill registry
        run: npm run verify:v74

      - name: Verify v75 agent capability fabric
        run: npm run verify:v75

      - name: Verify v76 semantic skill runtime
        run: npm run verify:v76

      - name: Verify v77 native skill runtime
        run: npm run verify:v77

      - name: Type check
        run: npm run typecheck

      - name: Production dependency audit
        run: npm run audit:production

      - name: Build
        run: npm run build

      - name: Runtime HTTP smoke gate
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/krom-forge-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/health > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/krom-forge-next.log
            echo "KROM Forge failed to become ready"
            exit 1
          fi

          node scripts/smoke-http.mjs http://127.0.0.1:3000

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krom-v77-verification-${{ github.sha }}
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
