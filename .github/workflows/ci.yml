name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - v49

jobs:
  quality:
    name: MCP quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify MCP registration, capabilities and version consistency
        run: npm run verify:mcp -- --output .artifacts/mcp-verification.json

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production dependency audit
        run: npm run audit:production

      - name: Build
        run: npm run build

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krom-v49-verification-${{ github.sha }}
          path: .artifacts/
          if-no-files-found: warn
          retention-days: 14

