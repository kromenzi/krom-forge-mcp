name: KROM Forge v77 CI

on:
  push:
    branches:
      - feat/v77-native-skill-runtime
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: v77-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      matrix:
        node: [20, 22]
    name: Verify v77 / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify v75 compatibility
        run: npm run verify:v75

      - name: Verify v76 compatibility
        run: npm run verify:v76

      - name: Verify v77 native skill runtime
        run: npm run verify:v77

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build
