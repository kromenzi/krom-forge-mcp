name: KROM Forge v76 CI

on:
  push:
    branches:
      - feat/v76-semantic-skill-runtime
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: v76-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify v76
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify v75 compatibility
        run: npm run verify:v75

      - name: Verify v76 semantic runtime
        run: npm run verify:v76

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build
