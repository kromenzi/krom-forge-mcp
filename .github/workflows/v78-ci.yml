name: KROM Forge v78 CI

on:
  push:
    branches:
      - feat/v78-autonomous-execution-governance
  pull_request:
    paths:
      - 'src/v78-**'
      - 'scripts/verify-v78-**'
      - 'app/mcp-v78/**'
      - 'app/mcp/route.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/v78-ci.yml'

jobs:
  verify-v78:
    strategy:
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify:v78
      - run: npm run typecheck
